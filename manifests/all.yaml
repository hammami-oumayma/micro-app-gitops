    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
---
# Source: micro-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: micro-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: hammamioumayma/auth:latest
        ports:
        - containerPort: 3001
        env:
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_KEY
        - name: MONGO_URI
          value: "mongodb+srv://admin:admin123@cluster0.uk0q0u3.mongodb.net/auth?appName=Cluster0"
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: rabbitmq_url
        - name: ADMIN_EMAIL
          value: "admin@example.com"
---
